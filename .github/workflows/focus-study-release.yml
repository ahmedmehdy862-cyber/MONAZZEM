name: Build and sync مُنظِّم release

# ملاحظة تكافؤ: خطوة «Verify update feed after sync» هنا تتحقق من أندرويد
# فقط (versionCode/versionName) — لا من حقل windows. workflow ويندوز
# (windows-desktop-release.yml) يعمل بعد نشر الـ Release وينشر حقل windows
# ويتحقق منه بنفسه. فنجاح هذا الـ workflow لا يعني اكتمال الإصدار:
# إن فشل workflow ويندوز يبقى الإصدار أندرويد فقط بصمت — أعد تشغيله
# يدويًا عبر workflow_dispatch للوسم نفسه (انظر رأسه).
#
# فحص اكتمال تلقائي (workflow يراقب نجاح/فشل ويندوز ويفتح issue عند غياب
# windows) مؤجَّل بانتظار قرار أحمد — لم يُنفَّذ هنا عمدًا.

on:
  push:
    tags:
      - "focus-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: update-site/package-lock.json

      - name: Verify committed admin bundle
        run: |
          cd update-site
          npm ci
          node build-admin.cjs
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- update-site/public/admin/app.bundle.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read release metadata
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          code = re.search(r"versionCode\s*=\s*(\d+)", text)
          name = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if not code or not name:
              raise SystemExit("Could not read versionCode/versionName from app/build.gradle.kts")
          tag = os.environ["TAG_NAME"]
          if tag != f"focus-v{name.group(1)}":
              raise SystemExit(f"Tag {tag} does not match app version {name.group(1)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={code.group(1)}\nversion_name={name.group(1)}\n")
          PY

      - name: Preflight update feed before release
        env:
          SYNC_TOKEN: ${{ secrets.FOCUS_RELEASE_SYNC_TOKEN }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "FOCUS_RELEASE_SYNC_TOKEN is empty" >&2
            exit 1
          fi
          # The only sync endpoint publishes immediately; there is no harmless validation or
          # dry-run endpoint in this API. Check the public feed and the token, then stop before
          # creating or uploading any GitHub Release if either check fails.
          curl --fail-with-body --silent --show-error \
            "https://update-site-sigma.vercel.app/api/latest?preflight=$(date +%s)" \
            -o /tmp/focus-latest-before.json
          python3 - <<'PY'
          import json, os
          with open("/tmp/focus-latest-before.json", encoding="utf-8") as stream:
              feed = json.load(stream)
          feed_code = int(feed["versionCode"])
          feed_name = str(feed.get("versionName") or "")
          new_code = int(os.environ["VERSION_CODE"])
          new_name = os.environ["VERSION_NAME"]
          # A Vercel deploy of release.json may already have published this same version; that is
          # fine. Reject an older code, or an equal code with a different version name.
          if new_code < feed_code or (new_code == feed_code and feed_name != new_name):
              raise SystemExit(
                  f"Release version conflicts with feed: new={new_code}/{new_name}, feed={feed_code}/{feed_name}"
              )
          print(f"Preflight OK: feed={feed_code}/{feed_name}, new={new_code}/{new_name}")
          PY

      - name: Restore Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.focusstudy"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.focusstudy/release.jks"
          cat > "$HOME/.focusstudy/keystore.properties" <<EOF
          storeFile=$HOME/.focusstudy/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$HOME/.focusstudy/release.jks" "$HOME/.focusstudy/keystore.properties"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease -PfocusStudyUpdateFeedUrl=https://update-site-sigma.vercel.app/api/latest

      - name: Prepare stable APK asset name
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MONAZZEM.apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          # User-facing notes live in docs/release-notes.md (plain Arabic, no
          # technical commit text); a friendly generic line is the fallback.
          if [ -s docs/release-notes.md ] && grep -q '[^[:space:]]' docs/release-notes.md; then
            NOTES="$(cat docs/release-notes.md)"
          else
            NOTES="تحديث جديد من مُنظِّم: تحسينات وإصلاحات وتجربة أفضل."
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" app/build/outputs/apk/release/MONAZZEM.apk --clobber
            gh release edit "$TAG_NAME" --title "مُنظِّم $VERSION_NAME" --notes "$NOTES"
          else
            gh release create "$TAG_NAME" app/build/outputs/apk/release/MONAZZEM.apk --title "مُنظِّم $VERSION_NAME" --notes "$NOTES"
          fi

      - name: Sync central feed for the app and QUBIXStore
        env:
          SYNC_TOKEN: ${{ secrets.FOCUS_RELEASE_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          test -n "$SYNC_TOKEN"
          # Same user-facing notes as the GitHub Release above, so the feed and
          # the store page show exactly what the user reads on the release.
          if [ -s docs/release-notes.md ] && grep -q '[^[:space:]]' docs/release-notes.md; then
            NOTES="$(cat docs/release-notes.md)"
          else
            NOTES="تحديث جديد من مُنظِّم: تحسينات وإصلاحات وتجربة أفضل."
          fi
          APK_URL="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/MONAZZEM.apk"
          export NOTES APK_URL
          python3 - <<'PY' > /tmp/focus-release.json
          import json, os
          print(json.dumps({
            "versionCode": int(os.environ["VERSION_CODE"]),
            "versionName": os.environ["VERSION_NAME"],
            "releaseNotes": os.environ.get("NOTES", "تحسينات وإصلاحات جديدة."),
            "apkUrl": os.environ["APK_URL"],
            "storeUrl": "https://qubixstore.vercel.app/focus-study-updates",
            "description": "نظّم مهامك وموادك وجلسات تركيزك وخطتك الدراسية في مساحة واحدة."
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/focus-release.json \
            https://update-site-sigma.vercel.app/api/admin/publish-ci

      - name: Verify update feed after sync
        env:
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected_code = int(os.environ["VERSION_CODE"])
          expected_name = os.environ["VERSION_NAME"]
          last = "no response"
          for attempt in range(1, 13):
              url = f"https://update-site-sigma.vercel.app/api/latest?verify={int(time.time())}"
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      feed = json.load(response)
                  actual_code = int(feed.get("versionCode") or 0)
                  actual_name = str(feed.get("versionName") or "")
                  if actual_code == expected_code and actual_name == expected_name:
                      print(f"Feed verified: {actual_code} / {actual_name}")
                      break
                  last = f"{actual_code} / {actual_name}"
              except Exception as error:
                  last = str(error)
              if attempt < 12:
                  time.sleep(10)
          else:
              raise SystemExit(
                  f"Feed did not report {expected_code} / {expected_name} after sync; last={last}"
              )
          PY
