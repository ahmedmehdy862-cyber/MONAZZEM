# Adhan alert verification on the published 0.33.1 code (branch adhan-verify, base a3adcf60).
#
# يعمل يدويًا (workflow_dispatch) وعند أي push على فرع adhan-verify.
# بلا نشر وبلا وسم: مهمته إثبات أن إشعارات الأذان بالتصميم الجديد تعمل
# فعلًا — منبّه دقيق ← مستقبل ← إشعار + ملء شاشة على جهاز مقفل + ستارة.
# اللقطات وسجل النظام تُرفع كـ artifact وتُقرأ يدويًا؛ لا يوجد أي ادعاء
# آلي بجودة الواجهة.
#
# يعيد استخدام بنية فرع emulator-qa-final (ubuntu + KVM، التشغيل 11 الناجح
# 45765011998 على 0.33.1): التطبيق offline-first وML Kit مضمّن، فصورة
# google_apis تكفي (بلا Play). API 34 هو الأساس؛ API 30 حد أدنى ثانٍ.
# اللقطات تُسحب بـ adb pull داخل الـ script لأن المحاكي يُطفأ بعده.
# إصلاح عن الأصل: TEST_EXIT كان غير معرّف (exit بلا كود يخفي فشل gradle)؛
# هنا يُلتقط صراحةً بعد set +e.
name: Adhan Alert Verification

on:
  workflow_dispatch:
  push:
    branches:
      - adhan-verify

permissions:
  contents: read

concurrency:
  group: adhan-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adhan-verify:
    name: Adhan Verify (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 30]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install SDK packages used by the build
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm device on this runner"

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # شبكة أمان فقط: إن غاب KVM فعلًا يسمح بالمحاكاة البرمجية TCG
          # بدل رفض -accel off الفوري. مع KVM يعمل التسريع العادي.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            TEST_EXIT=0
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.focusstudy.poc.AdhanAlertEmulatorTest || TEST_EXIT=$?
            echo "gradle exit: $TEST_EXIT"
            # سحب اللقطات من التنزيلات المشتركة: الاختبار يصدّرها إليها عبر
            # MediaStore (انظر QaExport) لأن مجلد التطبيق الخارجي يُحذف
            # عند إلغاء تثبيت التطبيق بعد الاختبارات. سحب عادي بلا run-as.
            # ملاحظة: نمط set +e وحده لم يمنع توقف السكربت عند فشل gradle
            # في التشغيل الأول (المشغّل ينهي العملية)؛ نمط || هو الآمن مع -e.
            adb pull /sdcard/Download/qa-screenshots "./qa-screenshots-api${{ matrix.api-level }}" || echo "screenshot pull failed (app may have crashed before first shot)"
            ls "./qa-screenshots-api${{ matrix.api-level }}" || true
            adb logcat -d > ./logcat-api${{ matrix.api-level }}.txt || true
            exit $TEST_EXIT

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhan-verify-api${{ matrix.api-level }}
          path: |
            qa-screenshots-api${{ matrix.api-level }}
            logcat-api${{ matrix.api-level }}.txt
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn
