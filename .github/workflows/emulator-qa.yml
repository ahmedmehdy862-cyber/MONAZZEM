# Emulator QA — Quran reader zoom screenshots (branch quran-zoom, base 8817225).
#
# يعمل يدويًا (workflow_dispatch) وعند أي push على فرع quran-zoom.
# بلا نشر وبلا وسم: مهمته لقطات قارئ المصحف + تقرير فقط. اللقطات تُرفع
# كـ artifact وتُقرأ يدويًا؛ لا يوجد أي ادعاء آلي بجودة الواجهة.
#
# يعيد استخدام بنية فرع emulator-qa (التشغيل 11 الناجح 45765011998 على
# 0.33.1): KVM على ubuntu-latest، وTCG كشبكة أمان إن غاب KVM، وسحب
# اللقطات بـ adb pull من التنزيلات المشتركة (انظر QaExport).
#
# API 34 فقط: الهدف لقطات تخطيط نص (لا توافق إصدارات)، فلا داعي لمصفوفة.
name: Emulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - quran-zoom

permissions:
  contents: read

concurrency:
  group: quran-zoom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-qa:
    name: Emulator QA (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install SDK packages used by the build
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm device on this runner"

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # شبكة أمان فقط: إن غاب KVM فعلًا يسمح بالمحاكاة البرمجية TCG
          # بدل رفض -accel off الفوري. مع KVM يعمل التسريع العادي.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            # مهم: التقاط رمز الخروج بـ || بدل إيقاف السكربت عند أول فشل —
            # وإلا أُجهض السحب كله عند فشل الاختبار (كما في التشغيل
            # 45803901266: فشل connectedDebugAndroidTest فلم تُسحب أي لقطة
            # رغم التقاطها فعلًا على الجهاز) ولم يصلنا أي دليل بصري.
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace || TEST_EXIT=$?
            # سحب اللقطات من التنزيلات المشتركة: الاختبار يصدّرها إليها عبر
            # MediaStore (انظر QaExport) لأن مجلد التطبيق الخارجي يُحذف
            # عند إلغاء تثبيت التطبيق بعد الاختبارات. سحب عادي بلا run-as.
            adb pull /sdcard/Download/qa-screenshots "./qa-screenshots-api34" || echo "screenshot pull failed (app may have crashed before first shot)"
            ls "./qa-screenshots-api34" || true
            adb logcat -d > ./logcat-api34.txt || true
            exit ${TEST_EXIT:-0}

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-api34
          path: |
            qa-screenshots-api34
            logcat-api34.txt
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn
