# Emulator QA: يشغّل التطبيق على محاكي أندرويد حقيقي ويلتقط كل شاشة رئيسية.
#
# يعمل يدويًا (workflow_dispatch) وعند أي push على فرع emulator-qa.
# بلا نشر وبلا وسم: مهمته لقطات + تقرير QA فقط. اللقطات تُرفع كـ artifact
# وتُقرأ يدويًا؛ لا يوجد أي ادعاء آلي بجودة الواجهة.
#
# ملاحظات:
# - التطبيق offline-first وML Kit مضمّن، فصورة google_apis تكفي (بلا Play).
# - API 34 هو الأساس؛ API 30 حد أدنى ثانٍ (minSdk 26 لكن المحاكي 30 أسرع
#   وأكثر استقرارًا في CI من 26/27).
# - اللقطات تُسحب بـ adb pull داخل الـ script لأن المحاكي يُطفأ بعده.
name: Emulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - emulator-qa

permissions:
  contents: read

concurrency:
  group: emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-qa:
    name: Emulator QA (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 30]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install SDK packages used by the build
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_EXIT=$?
            adb pull /sdcard/Android/data/com.focusstudy.poc/files/qa-screenshots ./qa-screenshots-api${{ matrix.api-level }} || echo "screenshot pull failed (app may have crashed before first shot)"
            adb logcat -d > ./logcat-api${{ matrix.api-level }}.txt || true
            exit $TEST_EXIT

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-api${{ matrix.api-level }}
          path: |
            qa-screenshots-api${{ matrix.api-level }}
            logcat-api${{ matrix.api-level }}.txt
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn
