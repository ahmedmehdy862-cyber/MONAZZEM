# Emulator QA: يشغّل التطبيق على محاكي أندرويد حقيقي ويلتقط كل شاشة رئيسية.
#
# يعمل يدويًا (workflow_dispatch) وعند أي push على فرع emulator-qa.
# بلا نشر وبلا وسم: مهمته لقطات + تقرير QA فقط. اللقطات تُرفع كـ artifact
# وتُقرأ يدويًا؛ لا يوجد أي ادعاء آلي بجودة الواجهة.
#
# ملاحظات:
# - التطبيق offline-first وML Kit مضمّن، فصورة google_apis تكفي (بلا Play).
# - API 34 هو الأساس؛ API 30 حد أدنى ثانٍ (minSdk 26 لكن المحاكي 30 أسرع
#   وأكثر استقرارًا في CI من 26/27).
# - اللقطات تُسحب بـ adb pull داخل الـ script لأن المحاكي يُطفأ بعده.
# - سجل محاولات التشغيل (موثق كاملًا في تقرير QA):
#   1) ubuntu-latest بلا خطوة KVM (45751255406): الأكشن رأى /dev/kvm غير
#      متاح فأوقف التسريع، والمحاكي 37+ يرفض -accel off («Software CPU
#      emulation is not supported»).
#   2) macos-latest + arm64-v8a (45752742594): عدّاءات macOS المستضافة
#      آلات افتراضية بلا nested virtualization، ففشل HVF («HVF error:
#      HV_UNSUPPORTED») — وهذا قيد عام موثق، لا خاص بنا.
#   3) ubuntu-latest + خطوة Enable KVM من README الأكشن نفسه (النمط
#      الموثق): ubuntu هو المسار الموصى به. وكشبكة أمان،
#      ANDROID_I_WANT_MY_TCG=yes يسمح بالمحاكاة البرمجية TCG إن غاب KVM
#      فعلًا بدل الفشل الفوري (أبطأ بكثير، لكنه يعمل).
name: Emulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - emulator-qa

permissions:
  contents: read

concurrency:
  group: emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-qa:
    name: Emulator QA (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 30]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install SDK packages used by the build
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm device on this runner"

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # شبكة أمان فقط: إن غاب KVM فعلًا يسمح بالمحاكاة البرمجية TCG
          # بدل رفض -accel off الفوري. مع KVM يعمل التسريع العادي.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_EXIT=$?
            adb pull /sdcard/Android/data/com.focusstudy.poc/files/qa-screenshots ./qa-screenshots-api${{ matrix.api-level }} || echo "screenshot pull failed (app may have crashed before first shot)"
            adb logcat -d > ./logcat-api${{ matrix.api-level }}.txt || true
            exit $TEST_EXIT

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa-api${{ matrix.api-level }}
          path: |
            qa-screenshots-api${{ matrix.api-level }}
            logcat-api${{ matrix.api-level }}.txt
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn
